[package]
name = "dj-party"
version = "0.1.0"
edition = "2024"
description = "Browser-first collaborative DJ mixer with a Rust core"
license = "MIT OR Apache-2.0"
repository = "https://github.com/moritzbrantner/dj-party"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# wasm-pack 0.13.1 bundles a wasm-opt build that cannot validate the bulk-memory
# and saturating conversion instructions emitted by Rust 1.95. The Rust release
# build still uses size optimization + LTO; skip only this incompatible post-pass.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
