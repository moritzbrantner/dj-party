[package]
name = "dj-party"
version = "0.1.0"
edition = "2024"
description = "Browser-first collaborative DJ mixer with a Rust core"
license = "MIT OR Apache-2.0"
repository = "https://github.com/moritzbrantner/dj-party"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
audio-analysis-processing = { package = "moenarch-audio-analysis-processing", git = "https://github.com/moritzbrantner/audio-analysis.git", rev = "7bd22d0d0efde1f8b836f4941de60f53862fe7f5" }
audio-analysis-rhythm = { package = "moenarch-audio-analysis-rhythm", git = "https://github.com/moritzbrantner/audio-analysis.git", rev = "7bd22d0d0efde1f8b836f4941de60f53862fe7f5" }

[dev-dependencies]
hound = "=3.5.1"
serde_json = "=1.0.154"
sha2 = "=0.11.1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
