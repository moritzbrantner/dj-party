[package]
name = "dj-party"
version = "0.1.0"
edition = "2024"
description = "Browser-first collaborative DJ mixer with a Rust core"
license = "MIT OR Apache-2.0"
repository = "https://github.com/moritzbrantner/dj-party"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
audio-analysis-processing = { package = "moenarch-audio-analysis-processing", git = "https://github.com/moritzbrantner/audio-analysis.git", rev = "7e01e0ffdecbaa1c4259d1c7d8a62258554738d8" }
audio-analysis-rhythm = { package = "moenarch-audio-analysis-rhythm", git = "https://github.com/moritzbrantner/audio-analysis.git", rev = "4b9307f6c97187f14e07bc6fa3dd873206a8bf89" }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
