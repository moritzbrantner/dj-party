name: TypeScript migration codemod

on:
  push:
    branches: [chore/typescript-convergence]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    name: Declare migrated class state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out migration branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: chore/typescript-convergence
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"

      - name: Install TypeScript
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Declare only observed class state
        run: node scripts/declare-typescript-state.mjs

      - name: Verify generated patch shape
        run: git diff --check

      - name: Commit migration declarations
        run: |
          git add web tsconfig.json
          if git diff --cached --quiet; then
            echo "No TypeScript state declarations needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: declare migrated TypeScript class state"
          git push origin HEAD:chore/typescript-convergence

      - name: Run semantic TypeScript validation
        run: npm run typecheck
