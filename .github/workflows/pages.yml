name: Validate and Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --all-features

      - name: Check browser JavaScript syntax
        run: |
          for file in web/app.js web/analysis-worker.js; do
            node --input-type=module --check < "$file"
          done

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Build GitHub Pages artifact
        run: bash scripts/build-pages.sh

      - name: Verify Pages asset graph
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          root = Path("_site").resolve()
          html_path = root / "index.html"

          class LocalAssets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.paths = []

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == "link" and values.get("href"):
                      self.paths.append(values["href"])
                  if tag == "script" and values.get("src"):
                      self.paths.append(values["src"])

          parser = LocalAssets()
          parser.feed(html_path.read_text())

          for raw in parser.paths:
              parsed = urlparse(raw)
              if parsed.scheme or parsed.netloc:
                  continue
              target = (html_path.parent / parsed.path).resolve()
              assert target == root or root in target.parents, f"asset escapes _site: {raw}"
              assert target.is_file() and target.stat().st_size > 0, f"missing local asset: {raw}"

          app = (root / "app.js").read_text()
          worker = (root / "analysis-worker.js").read_text()
          assert './pkg/dj_party.js' in app, "browser adapter does not reference generated WASM package"
          assert './pkg/dj_party.js' in worker, "analysis worker does not reference generated WASM package"
          assert 'analysis-worker.js' in app, "browser adapter does not start the analysis worker"
          assert (root / "pkg" / "dj_party.js").is_file(), "missing generated WASM JavaScript"
          assert (root / "pkg" / "dj_party_bg.wasm").is_file(), "missing generated WASM binary"
          PY

  pages:
    name: Build Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Build GitHub Pages artifact
        run: bash scripts/build-pages.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    name: Deploy Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
