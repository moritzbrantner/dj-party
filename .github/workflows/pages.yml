name: Validate and Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Lint Rust
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --all-features

      - name: Check browser JavaScript syntax
        run: |
          for file in web/app.js web/mixer-app.js web/library.js web/library-imports.js web/archive-import.js web/analysis-cache.js web/analysis-worker.js web/performance.js web/output-routing.js web/effects.js; do
            node --input-type=module --check < "$file"
          done

      - name: Test browser-local helpers
        run: node --test web/library.test.mjs web/archive-import.test.mjs web/analysis-cache.test.mjs

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Build GitHub Pages artifact
        run: bash scripts/build-pages.sh

      - name: Verify Pages asset graph
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          root = Path("_site").resolve()
          html_path = root / "index.html"

          class LocalAssets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.paths = []

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == "link" and values.get("href"):
                      self.paths.append(values["href"])
                  if tag == "script" and values.get("src"):
                      self.paths.append(values["src"])

          parser = LocalAssets()
          parser.feed(html_path.read_text())

          for raw in parser.paths:
              parsed = urlparse(raw)
              if parsed.scheme or parsed.netloc:
                  continue
              target = (html_path.parent / parsed.path).resolve()
              assert target == root or root in target.parents, f"asset escapes _site: {raw}"
              assert target.is_file() and target.stat().st_size > 0, f"missing local asset: {raw}"

          app = (root / "app.js").read_text()
          mixer = (root / "mixer-app.js").read_text()
          library = (root / "library.js").read_text()
          library_imports = (root / "library-imports.js").read_text()
          archive_import = (root / "archive-import.js").read_text()
          analysis_cache = (root / "analysis-cache.js").read_text()
          worker = (root / "analysis-worker.js").read_text()
          performance = (root / "performance.js").read_text()
          routing = (root / "output-routing.js").read_text()
          effects = (root / "effects.js").read_text()
          assert './library.js' in app, "browser bootstrap does not install the local track library"
          assert './library-imports.js' in app, "browser bootstrap does not install archive/playlist imports"
          assert './library-imports.css' in app, "browser bootstrap does not install archive/playlist styles"
          assert './mixer-app.js' in app, "browser bootstrap does not start the mixer adapter"
          assert './archive-import.js' in library_imports, "library imports do not reference bounded archive helpers"
          assert 'extractZipLibrary' in library_imports and 'parseM3u' in library_imports, "ZIP/M3U import path is incomplete"
          assert 'DecompressionStream' in archive_import and 'crc32' in archive_import, "ZIP import does not expose bounded browser decompression and checksum verification"
          assert './analysis-cache.js' in worker, "analysis worker does not reference analysis cache"
          assert 'readCachedTrackAnalysis' in worker and 'writeCachedTrackAnalysis' in worker, "analysis worker does not reuse cached analysis"
          assert 'SHA-256' in analysis_cache and 'ANALYSIS_CACHE_NAMESPACE' in analysis_cache, "analysis cache is not content-addressed and versioned"
          assert './pkg/dj_party.js' in mixer, "mixer adapter does not reference generated WASM package"
          assert './pkg/dj_party.js' in worker, "analysis worker does not reference generated WASM package"
          assert './pkg/dj_party.js' in performance, "performance transport does not reference generated WASM package"
          assert './pkg/dj_party.js' in effects, "effects adapter does not reference generated WASM package"
          assert './performance.js' in mixer, "mixer adapter does not reference performance transport"
          assert './output-routing.js' in mixer, "mixer adapter does not reference output-routing adapter"
          assert './effects.js' in mixer, "mixer adapter does not reference deck effects adapter"
          assert './monitoring.css' in mixer, "mixer adapter does not reference monitoring styles"
          assert './effects.css' in effects, "effects adapter does not reference effects styles"
          assert 'analysis-worker.js' in mixer, "mixer adapter does not start the analysis worker"
          assert 'MonitorMixer' in mixer, "mixer adapter does not use Rust-owned monitor semantics"
          assert 'DeckEffects' in mixer, "mixer adapter does not route decks through effects"
          assert 'plan_deck_tone' in effects, "effects adapter does not use Rust-owned tone policy"
          assert 'createBiquadFilter' in effects, "effects adapter does not apply the tone plan through Web Audio"
          assert 'indexedDB' in library, "track library does not use browser-local IndexedDB storage"
          assert 'multiple' in library and 'webkitdirectory' in library, "track library does not expose batch and folder import"
          assert 'DataTransfer' in library, "saved tracks cannot be handed back to the existing deck file path"
          assert './library.css' in library, "track library does not reference its local stylesheet"
          assert 'selectAudioOutput' in routing and 'setSinkId' in routing, "output-routing adapter does not own browser sink selection"
          assert 'phase-sync' in html_path.read_text(), "phase-sync controls missing from Pages HTML"
          for asset in [
              "library.css", "library.js", "library-imports.js", "library-imports.css",
              "archive-import.js", "analysis-cache.js", "mixer-app.js", "monitoring.css",
              "output-routing.js", "effects.js", "effects.css"
          ]:
              assert (root / asset).is_file(), f"missing Pages asset: {asset}"
          assert (root / "pkg" / "dj_party.js").is_file(), "missing generated WASM JavaScript"
          assert (root / "pkg" / "dj_party_bg.wasm").is_file(), "missing generated WASM binary"
          PY

  pages:
    name: Build Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked

      - name: Build GitHub Pages artifact
        run: bash scripts/build-pages.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    name: Deploy Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
