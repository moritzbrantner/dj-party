name: Shared performance transport slice

on:
  push:
    branches: [feat/shared-performance-transport]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out slice branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: feat/shared-performance-transport
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"

      - name: Apply performance transport slice
        run: |
          node scripts/run-shared-performance-slice.mjs
          node scripts/harden-shared-performance-slice.mjs

      - name: Install web tooling
        run: npm install --no-package-lock --ignore-scripts --no-audit --no-fund

      - name: Type-check TypeScript
        run: npm run typecheck

      - name: Run browser tests
        run: npm run test:web

      - name: Commit deterministic source slice
        run: |
          git diff --check
          git add web README.md AGENTS.md
          if git diff --cached --quiet; then
            echo "Shared performance transport slice already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: replay beat jumps from initiating playhead"
          git push origin HEAD:feat/shared-performance-transport
